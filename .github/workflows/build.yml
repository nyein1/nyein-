name: Build Wear OS Watch Face APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug
      - name: Prepare direct-download APK
        run: cp app/build/outputs/apk/debug/*.apk industrial-orange-watchface.apk
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: industrial-orange-watchface-apk
          path: industrial-orange-watchface.apk
          if-no-files-found: error
          retention-days: 14
      - name: Publish APK release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Industrial Orange Watch Face build ${{ github.run_number }}
          files: industrial-orange-watchface.apk
          generate_release_notes: true
